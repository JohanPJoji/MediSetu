services:
  postgres:
    image: postgres:16
    container_name: medisetu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisetu
      POSTGRES_PASSWORD: medisetu_dev_password
      POSTGRES_DB: medisetu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisetu -d medisetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: medisetu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: MediSetu Backend
      ENVIRONMENT: development
      API_V1_PREFIX: /api
      LOG_LEVEL: INFO
      JWT_SECRET: development-only-change-me
      STT_PROVIDER: mock
      LLM_PROVIDER: mock
      MOCK_TRANSCRIPT: "I have chest pain."
      DATABASE_URL: postgresql+asyncpg://medisetu:medisetu_dev_password@postgres:5432/medisetu
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    container_name: medisetu_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
